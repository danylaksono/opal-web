# Static host configuration for the Phase 0 spike deploy (PLAN.md 11.1).
#
# The COOP/COEP block is commented out deliberately: PLAN.md 7.3 treats
# cross-origin isolation as something to measure, not assume. Enabling it here
# must happen together with OPAL_COI=1 in the dev/preview server so local and
# deployed behaviour agree.

[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback. Project identity stays out of the URL (PLAN.md 5.3).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# WASM must be served with the correct type or streaming compilation fails.
[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"
    Cache-Control = "public, max-age=31536000, immutable"

# Hashed build assets are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Siglum's engine bundles are pre-compressed payloads the engine gunzips itself,
# not files the transport should encode. Serving them with Content-Encoding:
# gzip makes the browser decompress them transparently, and the engine then
# fails to gunzip plain bytes — with every request still returning 200. Keep
# Content-Encoding absent. See docs/adr/003-latex-engine.md.
#
# Scoped to the .data.gz payloads, not all of /engines/. A broader rule also
# caught busytex.wasm — 29.4 MB, the single largest response in a first load —
# and octet-stream is the one content type that both rules out
# `WebAssembly.instantiateStreaming` and stops a CDN compressing it. That
# divergence was invisible locally, where Vite's middleware keys on `.data.gz`
# and serves the engine as application/wasm. vite.config.ts is the reference
# for what this rule should match.
[[headers]]
  for = "/engines/*.data.gz"
  [headers.values]
    Content-Type = "application/octet-stream"
    Cache-Control = "public, max-age=31536000, immutable"

# Everything else the engine ships — the WASM binary, its JS glue, the bundle
# manifests — takes its natural type so it can be compressed and, for the WASM,
# streamed.
[[headers]]
  for = "/engines/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell must never be cached, or the app cannot be updated.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

