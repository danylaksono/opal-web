name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      # The corpus is committed, but regenerating it must be a no-op. A diff
      # here means the fixtures drifted from the generator that documents them.
      - name: Corpus manifest is reproducible
        run: |
          git diff --exit-code -- tests/fixtures/compiler-corpus/manifest.json
